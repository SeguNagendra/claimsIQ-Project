services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: claimiq
      POSTGRES_USER: claimiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  bootstrap:
    build:
      context: ..
      dockerfile: utilities/Dockerfile
      target: api
    command: ["python", "-m", "app.bootstrap_admin"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg2://claimiq:${POSTGRES_PASSWORD}@postgres:5432/claimiq
      CLAIMIQ_ADMIN_USERNAME: ${CLAIMIQ_ADMIN_USERNAME:?Set CLAIMIQ_ADMIN_USERNAME in the project .env file}
      CLAIMIQ_ADMIN_PASSWORD: ${CLAIMIQ_ADMIN_PASSWORD:?Set CLAIMIQ_ADMIN_PASSWORD in the project .env file}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: utilities/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://claimiq:${POSTGRES_PASSWORD}@postgres:5432/claimiq
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the project .env file}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-policy-documents}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT:-}
      AZURE_SEARCH_INDEX_NAME: ${AZURE_SEARCH_INDEX_NAME:-policy-chunks}
      AZURE_SEARCH_API_KEY: ${AZURE_SEARCH_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    build:
      context: ..
      dockerfile: utilities/Dockerfile
      target: dashboard
    restart: unless-stopped
    environment:
      CLAIMIQ_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
