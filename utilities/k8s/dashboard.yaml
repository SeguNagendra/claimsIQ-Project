apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimiq-dashboard
  namespace: claimiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claimiq-dashboard
  template:
    metadata:
      labels:
        app: claimiq-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: claimiq-dashboard
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: CLAIMIQ_API_URL
              value: http://claimiq-api:8000
            - name: STREAMLIT_SERVER_ADDRESS
              value: 0.0.0.0
            - name: STREAMLIT_SERVER_PORT
              value: "8501"
            - name: STREAMLIT_CONFIG_DIR
              value: /tmp/.streamlit
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: claimiq-dashboard
  namespace: claimiq
spec:
  type: LoadBalancer
  selector:
    app: claimiq-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
