apiVersion: batch/v1
kind: Job
metadata:
  name: claimiq-bootstrap
  namespace: claimiq
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: claimiq-api
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.bootstrap_admin
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: claimiq-secrets
                  key: database-url
            - name: CLAIMIQ_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: claimiq-secrets
                  key: bootstrap-admin-username
            - name: CLAIMIQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimiq-secrets
                  key: bootstrap-admin-password
