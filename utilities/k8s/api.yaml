apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimiq-api
  namespace: claimiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claimiq-api
  template:
    metadata:
      labels:
        app: claimiq-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: claimiq-api
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: claimiq-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: claimiq-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claimiq-secrets
                  key: jwt-secret
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: claimiq-azure-services
                  key: storage-connection-string
                  optional: true
            - name: AZURE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claimiq-azure-services
                  key: search-api-key
                  optional: true
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claimiq-azure-services
                  key: openai-api-key
                  optional: true
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom:
                configMapKeyRef:
                  name: claimiq-config
                  key: AZURE_STORAGE_ACCOUNT_NAME
                  optional: true
            - name: AZURE_SEARCH_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: claimiq-config
                  key: AZURE_SEARCH_ENDPOINT
                  optional: true
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: claimiq-config
                  key: AZURE_OPENAI_ENDPOINT
                  optional: true
            - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
              valueFrom:
                configMapKeyRef:
                  name: claimiq-config
                  key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
                  optional: true
            - name: AZURE_OPENAI_CHAT_DEPLOYMENT
              valueFrom:
                configMapKeyRef:
                  name: claimiq-config
                  key: AZURE_OPENAI_CHAT_DEPLOYMENT
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: claimiq-api
  namespace: claimiq
spec:
  type: LoadBalancer
  selector:
    app: claimiq-api
  ports:
    - name: http
      port: 8000
      targetPort: http
