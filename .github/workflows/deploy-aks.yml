name: Build and deploy ClaimIQ to AKS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - app/**
      - dashboard/**
      - scripts/**
      - requirements.txt
      - utilities/**
      - .github/workflows/deploy-aks.yml

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m compileall -q app dashboard
          python -m pytest -q tests/test_bootstrap_admin.py tests/test_rag_services.py

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Sign in to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          : "${ACR_NAME:?Set the ACR_NAME repository variable}"
          az acr login --name "$ACR_NAME"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push API image
        run: |
          docker buildx build \
            --file utilities/Dockerfile \
            --target api \
            --tag "${{ vars.ACR_NAME }}.azurecr.io/claimiq-api:${GITHUB_SHA}" \
            --push .
      - name: Build and push dashboard image
        run: |
          docker buildx build \
            --file utilities/Dockerfile \
            --target dashboard \
            --tag "${{ vars.ACR_NAME }}.azurecr.io/claimiq-dashboard:${GITHUB_SHA}" \
            --push .

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Configure kubectl
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing
      - name: Create namespace and application secrets
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLAIMIQ_ADMIN_USERNAME: ${{ secrets.CLAIMIQ_ADMIN_USERNAME }}
          CLAIMIQ_ADMIN_PASSWORD: ${{ secrets.CLAIMIQ_ADMIN_PASSWORD }}
        run: |
          : "${ACR_NAME:?Set the ACR_NAME repository variable}"
          : "${POSTGRES_PASSWORD:?Set the POSTGRES_PASSWORD repository secret}"
          : "${JWT_SECRET:?Set the JWT_SECRET repository secret}"
          : "${CLAIMIQ_ADMIN_USERNAME:?Set the CLAIMIQ_ADMIN_USERNAME repository secret}"
          : "${CLAIMIQ_ADMIN_PASSWORD:?Set the CLAIMIQ_ADMIN_PASSWORD repository secret}"
          kubectl apply -f utilities/k8s/namespace.yaml
          DATABASE_URL="$(python -c 'import os; from urllib.parse import quote; print("postgresql+psycopg2://claimiq:{}@postgres:5432/claimiq".format(quote(os.environ["POSTGRES_PASSWORD"], safe="")))')"
          echo "::add-mask::$DATABASE_URL"
          kubectl -n claimiq create secret generic claimiq-secrets \
            --from-literal=postgres-password="$POSTGRES_PASSWORD" \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --from-literal=bootstrap-admin-username="$CLAIMIQ_ADMIN_USERNAME" \
            --from-literal=bootstrap-admin-password="$CLAIMIQ_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy PostgreSQL and configuration
        run: |
          kubectl apply -f utilities/k8s/configmap.yaml
          kubectl apply -f utilities/k8s/postgres.yaml
          kubectl -n claimiq rollout status statefulset/postgres --timeout=5m
      - name: Initialize database and create the initial administrator
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl -n claimiq delete job claimiq-bootstrap --ignore-not-found
          sed "s|image: claimiq-api|image: $ACR_NAME.azurecr.io/claimiq-api:$IMAGE_TAG|" \
            utilities/k8s/bootstrap-job.yaml | kubectl apply -f -
          kubectl -n claimiq wait --for=condition=complete \
            job/claimiq-bootstrap --timeout=5m
      - name: Deploy API and dashboard
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed "s|image: claimiq-api|image: $ACR_NAME.azurecr.io/claimiq-api:$IMAGE_TAG|" \
            utilities/k8s/api.yaml | kubectl apply -f -
          sed "s|image: claimiq-dashboard|image: $ACR_NAME.azurecr.io/claimiq-dashboard:$IMAGE_TAG|" \
            utilities/k8s/dashboard.yaml | kubectl apply -f -
          kubectl -n claimiq rollout status deployment/claimiq-api --timeout=5m
          kubectl -n claimiq rollout status deployment/claimiq-dashboard --timeout=5m
          kubectl -n claimiq get services
